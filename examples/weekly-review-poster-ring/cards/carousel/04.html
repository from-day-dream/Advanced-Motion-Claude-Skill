<!doctype html>
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background-color:var(--brand-paper);color:var(--brand-ink);
  background-image:linear-gradient(var(--brand-grid) 1px,transparent 1px),linear-gradient(90deg,var(--brand-grid) 1px,transparent 1px);
  background-size:var(--brand-space-grid-cell) var(--brand-space-grid-cell)}
.top{position:absolute;top:96px;left:96px;right:96px;display:flex;justify-content:space-between;
  font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
.big{position:absolute;right:40px;top:110px;font-family:var(--brand-font-heading);font-style:italic;font-weight:600;font-size:600px;line-height:1;
  color:transparent;-webkit-text-stroke:3px var(--brand-accent)}
.main{position:absolute;left:96px;right:96px;bottom:220px}
.kicker{font-family:var(--brand-font-body);font-weight:600;font-size:var(--brand-size-meta);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-accent);margin:0 0 32px}
h2{margin:0;text-wrap:balance;font-family:var(--brand-font-heading);font-weight:600;font-size:var(--brand-size-headline);line-height:1.04;letter-spacing:-.02em}
h2 em{font-style:italic;color:var(--brand-accent)}
.key{text-wrap:pretty;margin:48px 0 0;max-width:800px;font-family:var(--brand-font-body);font-size:var(--brand-size-key);line-height:1.3}
.support{text-wrap:pretty;margin:28px 0 0;max-width:760px;font-family:var(--brand-font-body);font-size:var(--brand-size-support);line-height:1.4;color:var(--brand-muted)}
.teaser{position:absolute;left:96px;bottom:96px;font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
</style></head>
<body>
<div class="slide" data-slide="4">
  <div class="top"><span data-text="meta">@quietdesk.demo</span><span data-text="meta">04 / 05</span></div>
  <div class="big" data-visual aria-hidden="true">1</div>
  <div class="main">
    <p class="kicker" data-text="meta">Step 3 · 5 min</p>
    <h2 data-text="headline">Pick Monday's <em>one</em> task</h2>
    <p class="key" data-text="key">Write it on paper and leave it on your keyboard.</p>
    <p class="support" data-text="support">Monday starts with the decision already made.</p>
  </div>
  <div class="teaser" data-text="meta">Save this for Friday →</div>
</div>
</body></html>
