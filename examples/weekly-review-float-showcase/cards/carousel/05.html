<!doctype html>
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--brand-paper);color:var(--brand-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 96px}
.top{position:absolute;top:96px;left:96px;right:96px;display:flex;justify-content:space-between;
  font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
img{width:160px;height:160px;margin-bottom:64px}
h2{margin:0;text-wrap:balance;font-family:var(--brand-font-heading);font-weight:600;font-size:var(--brand-size-headline);line-height:1.04;letter-spacing:-.02em;max-width:820px}
h2 em{font-style:italic;color:var(--brand-accent)}
.support{text-wrap:pretty;margin:40px 0 0;font-family:var(--brand-font-body);font-size:var(--brand-size-support);line-height:1.4;color:var(--brand-muted)}
.handle{margin-top:72px;font-family:var(--brand-font-body);font-weight:600;font-size:var(--brand-size-key)}
</style></head>
<body>
<div class="slide" data-slide="5">
  <div class="top"><span data-text="meta">@quietdesk.demo</span><span data-text="meta">05 / 05</span></div>
  <img data-logo src="{{LOGO}}" alt="Quiet Desk">
  <h2 data-text="headline">Follow for <em>calmer</em> weeks</h2>
  <p class="support" data-text="support">One calm work habit, every Tuesday.</p>
  <p class="handle" data-text="key">@quietdesk.demo</p>
</div>
</body></html>
