<!doctype html>
<html><head><meta charset="utf-8">
<style>
{{FONT_FACES}}
{{TOKENS}}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background-color:var(--brand-paper);color:var(--brand-ink);
  background-image:linear-gradient(var(--brand-grid) 1px,transparent 1px),linear-gradient(90deg,var(--brand-grid) 1px,transparent 1px);
  background-size:var(--brand-space-grid-cell) var(--brand-space-grid-cell)}
.top{position:absolute;top:96px;left:96px;right:96px;display:flex;justify-content:space-between;
  font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
.main{position:absolute;left:96px;right:96px;top:378px}
h1{margin:0;text-wrap:balance;font-family:var(--brand-font-heading);font-weight:600;font-size:var(--brand-size-hook);line-height:1.06;letter-spacing:-.025em}
h1 em{font-style:italic;color:var(--brand-accent)}
.key{text-wrap:pretty;margin:56px 0 0;max-width:800px;font-family:var(--brand-font-body);font-size:var(--brand-size-key);line-height:1.3}
.key strong{font-weight:600;text-decoration:underline;text-decoration-color:var(--brand-accent);text-decoration-thickness:4px;text-underline-offset:8px}
.cue{position:absolute;left:96px;right:0;bottom:162px;height:2px;background:var(--brand-ink)}
.cue::after{content:"";position:absolute;right:96px;top:-11px;width:22px;height:22px;border-top:2px solid var(--brand-ink);border-right:2px solid var(--brand-ink);transform:rotate(45deg)}
.teaser{position:absolute;left:96px;bottom:96px;font-family:var(--brand-font-body);font-size:var(--brand-size-meta);letter-spacing:.12em;text-transform:uppercase;color:var(--brand-muted)}
</style></head>
<body>
<div class="slide" data-slide="1">
  <div class="top"><span data-text="meta">@quietdesk.demo</span><span data-text="meta">01 / 05</span></div>
  <div class="main">
    <h1 data-text="headline">Your weekly review, in <em>15</em> minutes</h1>
    <p class="key" data-text="key">Three short steps to end Friday knowing <strong>exactly what Monday needs</strong>.</p>
  </div>
  <div class="cue" data-cue="swipe"></div>
  <div class="teaser" data-text="meta">Swipe for the 3 steps</div>
</div>
</body></html>
