<!doctype html>
<!-- Card skeleton: statement. One idea in a few words (a point from the sources), at 1080×1350.
     Brand-neutral: BRAND_* placeholders bind to the brand's own tokens when cards.mjs renders it; you may
     also use var(--brand-<token>) directly. Structure only: restyle it per the brand's design-language.md. -->
<html><head><meta charset="utf-8">{{FONT_FACES}}{{TOKENS}}<style>
body { background: BRAND_BACKGROUND; color: BRAND_TEXT; font-family: BRAND_FONT_BODY; padding: 96px; display: flex; flex-direction: column; justify-content: space-between; }
.kicker { font-size: 26px; letter-spacing: .12em; text-transform: uppercase; color: BRAND_MUTED; }
h1 { font-family: BRAND_FONT_DISPLAY; font-weight: BRAND_WEIGHT_DISPLAY; font-size: 150px; line-height: .95; letter-spacing: -.03em; margin: 0; }
h1 em { font-family: BRAND_FONT_SECOND; font-style: BRAND_SECOND_STYLE; color: BRAND_ACCENT; }
.foot { font-size: 26px; color: BRAND_MUTED; }
</style></head><body>
  <div class="kicker">Kicker</div>
  <h1>A short <em>idea</em> here</h1>
  <div class="foot">Source or handle</div>
</body></html>
