<!doctype html>
<!-- The fixed page every scene renders in. scripts/render.mjs injects the brand (fonts, tokens), GSAP
     and the brand's curves (motionHead), and the resolved spec; runtime/scene.js builds the 3D scene.
     Layers, back to front: background, behind-type, WebGL cards, front-type. Never edited per scene. -->
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "troika-three-text": "/node_modules/troika-three-text/dist/troika-three-text.esm.js",
  "troika-three-utils": "/node_modules/troika-three-utils/dist/troika-three-utils.esm.js",
  "troika-worker-utils": "/node_modules/troika-worker-utils/dist/troika-worker-utils.esm.js",
  "webgl-sdf-generator": "/node_modules/webgl-sdf-generator/dist/webgl-sdf-generator.mjs",
  "bidi-js": "/node_modules/bidi-js/dist/bidi.mjs"
} }
</script>
<style>
  body { background: SCENE_BACKGROUND; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .type-layer { position: absolute; inset: 0; pointer-events: none; }
  #type-behind { z-index: 0; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; }
  #type-front { z-index: 2; }
</style>
</head>
<body>
<div id="stage">
  <div id="type-behind" class="type-layer"></div>
  <canvas id="gl"></canvas>
  <div id="type-front" class="type-layer"></div>
</div>
<script>window.__SPEC = SCENE_SPEC;</script>
<script type="module">
  import('/runtime/scene.js').catch(e => { window.__errors = [...(window.__errors || []), e.message]; });
</script>
</body>
</html>
